# zizmor configuration — accepted findings, each with a rationale.
# The CI `zizmor` job runs at --persona=pedantic, so anything not listed
# here fails the build.

rules:
  # dtolnay/rust-toolchain is deliberate, not superfluous: it pins the
  # toolchain snapshot by commit SHA, installs rustfmt/clippy components
  # reproducibly, and honors rust-toolchain.toml — the preinstalled runner
  # toolchain drifts with the image.
  superfluous-actions:
    ignore:
      - ci.yml
      - stress.yml
      - release.yml
      - install.yml
      - windows.yml

  # The wider `.github/` scope reaches dependabot.yml, which the workflow-only
  # glob never parsed. No cooldown is configured there (GitHub's built-in
  # default is three days; zizmor wants seven). Accepted rather than fixed
  # here: the fix changes dependency-update policy, which is a separate
  # decision from pointing the audit at `.github/` (#389).
  dependabot-cooldown:
    ignore:
      - dependabot.yml
